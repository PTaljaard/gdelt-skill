[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdelt-skill"
version = "0.1.0"
description = "GDELT 2.0 API Skill for Hermes Agent — SA Politics Monitoring"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Pieter Taljaard", email = "ptaljaard@outlook.com"}
]
keywords = [
    "gdelt", "osint", "geopolitics", "south-africa", 
    "hermes-agent", "neo4j", "bigquery", "ngrams"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
bigquery = [
    "google-cloud-bigquery>=3.11.0",
    "db-dtypes>=1.1.0",
]
neo4j = [
    "neo4j>=5.14.0",
]
llm = [
    "instructor>=1.0.0",
    "openai>=1.0.0",
    # or use ollama for local LLMs
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
]
all = [
    "google-cloud-bigquery>=3.11.0",
    "db-dtypes>=1.1.0",
    "neo4j>=5.14.0",
    "instructor>=1.0.0",
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/PTaljaard/gdelt-skill"
Repository = "https://github.com/PTaljaard/gdelt-skill"
Issues = "https://github.com/PTaljaard/gdelt-skill/issues"
Documentation = "https://github.com/PTaljaard/gdelt-skill/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "ARG", "PTH", "T20", "SIM"]
ignore = ["S101", "T201"]  # Allow assert and print in examples

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=scripts --cov-report=term-missing"

[tool.coverage.run]
source = ["scripts"]
omit = ["tests/*", "examples/*"]